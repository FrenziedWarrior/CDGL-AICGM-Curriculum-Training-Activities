<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 4 - Activity 3 - JavaScript Arrow Function</title>
  </head>
  <body>
    <h2>JavaScript Arrow Function</h2>

    <p>This example shows an Arrow Function with a parameter.</p>

    <p id="result"></p>

    <script>
      const add = (a, b) => a + b;

      document.getElementById('result').innerHTML = add(49, 456);
    </script>
  </body>
