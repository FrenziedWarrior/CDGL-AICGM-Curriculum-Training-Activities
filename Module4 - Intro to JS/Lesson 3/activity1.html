<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 4 - Lesson 3 - Activity 1 - Methods in JS</title>
</head>
<body>
    <h1>Javascript String Methods</h1>
    <p>Basic Methods</p>

    <script>
        var str = "AmAzInG";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        document.write("<br>");

        var str1 = "I learnt about Methods";
        var pattern = new RegExp("about");
        var result = pattern.test(str1);
        document.write(result);
    </script>
</body>
</html>
