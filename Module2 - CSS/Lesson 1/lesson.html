<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MODULE 2 - LESSON 1 - ACTIVITY 1 - My Colour Card</title>

    <style>
      /* UNIVERSAL SELECTOR */
      * {
        font-size: 10px;
        font-family: "Arial";
      }

      body {
        background-color: gray;
      }

      h1 {
        color: darkblue;
        font-style: italic;
        font-size: 50px;
      }

      p {
        color: red;
      }

      #my-card {
        background-color: pink;
        text-align: center;
      }

      .text-color-purple {
        color: purple;
      }

      .bold {
        font-weight: bold;
      }

      .freaky {
        transform: translateX(200px);
      }

    </style>

  </head>
  <body>
    <h1>My Colour Card</h1>

    <!-- Inline CSS: Add style="color: ____;" inside this p tag -->
    <p>Hi! This is my very own webpage.</p>

    <div id="my-card">
      <h2>About Me</h2>
      <p class="text-color-purple bold">My name is Sam.</p>
      <p class="text-color-purple">My favourite colour is red.</p>
      <p class="text-color-purple">My favourite subject is Maths.</p>
      <p class="text-color-purple">My favourite food is pasta.</p>
    </div>

    <h2>My Favourite Things</h2>
    <p>My favourite animal is a cat.</p>
    <p>My favourite sport is cricket.</p>
    <p class="text-color-purple">My favourite movie is The Lion King.</p>
  </body>
</html>
