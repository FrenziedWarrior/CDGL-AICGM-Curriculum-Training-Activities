<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICGM Module 4 - Lesson 1 - Activity 4 - Operators</title>
  </head>
  <body>
    <h2>Operators</h2>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>

    <!-- Addition -->
    <script>
      // use +, -, *, / operators
      var x = 5;
      var y = 2;
      var z = x + y;
      document.getElementById('demo1').innerHTML = z;

      z = x - y;
      document.getElementById('demo2').innerHTML = z;

      z = x * y;
      document.getElementById('demo3').innerHTML = z;

      z = x / y;
      document.getElementById('demo4').innerHTML = z;
    </script>
  </body>
</html>
