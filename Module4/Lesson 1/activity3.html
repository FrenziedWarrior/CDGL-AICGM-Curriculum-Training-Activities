<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICGM Module 4 - Lesson 1 - Activity 3 - Statements</title>
  </head>
  <body>
    <h2>JavaScript Statements</h2>

    <p>
      A <b>JavaScript program</b> is a list of <b>statements</b> to be executed by a computer.
    </p>

    <p id="myParagraph"></p>

    <script>
      var x, y, z; // Statement 1
      x = 345; // Statement 2
      y = 190; // Statement 3
      z = x / y; // Statement 4

      document.getElementById('myParagraph').innerHTML =
        'The value of z is ' + z + '.';
    </script>
  </body>
</html>
