<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 1 - Activity 1 - My Game Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: aliceblue;
        text-align: center;
        padding: 30px;
      }
      h1 {
        color: navy;
      }
      button {
        background: navy;
        color: white;
        padding: 10px 25px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
      }
      div {
        border: 1px solid navy;
        width: 280px;
        margin: 6px auto;
        padding: 8px 12px;
        text-align: left;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>My Game Profile</h1>

    <button onclick="showGameProfile()">Show Game Profile</button>

    <div>
      <strong>Name: </strong>
      <span id="name"></span>
    </div>

    <div><strong>Score: </strong><span id="score"></span></div>
    <div><strong>Top Score: </strong><span id="record"></span></div>
    <div><strong>Rank: </strong><span id="rank"></span></div>
    <div><strong>Greeting: </strong><span id="greeting"></span></div>
    <div><strong>Stars: </strong><span id="stars"></span></div>
    <div><strong>Bonus Level: </strong><span id="bonus"></span></div>
    <div><strong>Team Name: </strong><span id="team"></span></div>

    <script>
      function showGameProfile() {
        let name = "Abhishek Karmakar";
        document.getElementById("name").innerHTML = name;

        let team;
        document.getElementById("team").innerHTML = team;

        let bonus = null;
        document.getElementById("bonus").innerHTML = bonus;

        let myScore = 80;
        let highScore = 100;

        document.getElementById("score").innerHTML = myScore + " out of " + highScore;

        let isTopScore;
        if (myScore == highScore) {
          isTopScore = "❌";
        } else {
          isTopScore = "❌";
        }

        document.getElementById("record").innerHTML = isTopScore;

        let greeting;
        
        let hour = new Date().getHours();

        if (hour < 12) {
          greeting = "Good Morning";
        } else if (hour < 18) {
          greeting = "Good Afternoon";
        } else {
          greeting = "Good Evening";
        }

        document.getElementById("greeting").innerHTML = greeting + " " + name;
      }
    </script>
  </body>
</html>
