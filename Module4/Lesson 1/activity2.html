<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICGM Module 4 - Lesson 1 - Activity 2 - Variables</title>
  </head>
  <body>
    <h1>JavaScript Variables</h1>
    <p>Product of two Numbers</p>
    <p id="result"></p>

    <script>
      var num1 = 15;
      var num2 = 66;
      var product = num1 * num2;
      document.getElementById('result').innerHTML = `The product of ${num1} & ${num2} is ${product}`;
    </script>
  </body>
</html>
