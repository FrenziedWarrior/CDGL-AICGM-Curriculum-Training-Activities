<!doctype html>
<html lang="en">
  <head>
    <title>My Ocean World</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      }
      .navbar {
        background-color: #006994;
      }
      .navbar-brand,
      .nav-link {
        color: #fff !important;
      }
      .section-title {
        color: #006994;
        margin: 20px 0 10px;
      }
    </style>
  </head>

  <body>
    <!-- TOPIC 3: NAVIGATION BAR -->
    <header>
      <nav class="navbar navbar-expand-sm">
        <a class="navbar-brand" href="#">Planet Explorer</a>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Stars</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="container mt-4">
      <!-- TOPIC 1: SPINNERS -->
      <h4 class="section-title">Scanning the Galaxy...</h4>
      <div class="spinner-border text-primary"></div>
      <div class="spinner-border text-danger"></div>
      <div class="spinner-grow text-danger"></div>

      <!-- TOPIC 2: CARDS -->
      <h4 class="section-title">Featured Planets</h4>

      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <img src="" class="card-img-top" alt="Planet Earth">
            
            <div class="card-body">
              <h5 class="card-title"><strong>Planet Earth</strong></h5>
              <button class="btn btn-primary">Learn More</button>
            </div>
          </div>
        </div>

        <div class="col-md-4"></div>

        <div class="col-md-4"></div>
      </div>

      <!-- TOPIC 4: PAGINATION -->
      <h4 class="section-title">Browse More Planets</h4>
      <ul class="pagination">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>


    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
