<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 2 - Activity 1 - My Planet Cards</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        font-family: Arial;
        background: #f0f4ff;
        padding: 30px;
        text-align: center;
      }
      h1 {
        color: #0ea75b;
      }
      p {
        color: #555;
      }
      .planet-name {
        font-size: 22px;
        font-weight: bold;
        color: #333;
      }
      .planet-fact {
        color: #666;
        margin-top: 10px;
        font-size: 14px;
      }
      button {
        background: #0ea75b;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🌎 My Planet Cards</h1>
    <p>Use a JavaScript class to build planet cards!</p>
    <button onclick="showPlanets()">Show Planets!</button>
    <div class="container mt-5">
      <div class="row">
        <div class="col-4">
          <div id="card1"></div>
        </div>
        <div class="col-4">
          <div id="card2"></div>
        </div>
        <div class="col-4">
          <div id="card3"></div>
        </div>
      </div>
    </div>
    <script>
      class Planet {
        constructor(name, fact, distance) {
          this.name = name;
          this.fact = fact;
          this.distanceFromSun = distance;
        }
        describe() {
          return this.name + ': ' + this.fact + "<br><br>" + "Distance from Sun: <b>" + this.distanceFromSun + "</b>";
        }
      }

      function showPlanets() {
        let p1 = new Planet('Earth', 'The only planet with life', 149.6);
        let p2 = new Planet('Mars', 'Known as the Red Planet', 227.9);
        let p3 = new Planet('Saturn', 'Has rings made of ice', 1433.5);

        document.getElementById('card1').innerHTML =
          "<div class='card shadow p-2 border border-success border-3'><div class='planet-name'>" +
          p1.name +
          '</div>' +
          "<div class='planet-fact'>" +
          p1.describe() +
          '</div></div>';

        document.getElementById('card2').innerHTML =
          "<div class='card shadow p-2 border border-danger border-3'><div class='planet-name'>" +
          p2.name +
          '</div>' +
          "<div class='planet-fact'>" +
          p2.describe() +
          '</div></div>';

        document.getElementById('card3').innerHTML =
          "<div class='card shadow p-2 border border-dark border-3'><div class='planet-name'>" +
          p3.name +
          '</div>' +
          "<div class='planet-fact'>" +
          p3.describe() +
          '</div></div>';
      }
    </script>
  </body>
</html>
