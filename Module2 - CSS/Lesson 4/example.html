<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Examples - Module 2 Lesson 4</title>
    <style>

        ul > li {
            color: blue;
        }

        /* ALL DESCENDENTS WHICH ARE <a> */
        ul a {
            color: red;
        }

    </style>
</head>

<body>


    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>
            <a>Wikipedia</a>
        </li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
</body>

</html>
