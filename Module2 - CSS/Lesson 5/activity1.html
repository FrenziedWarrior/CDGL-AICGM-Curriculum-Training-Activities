<!doctype html>
<html lang="en">
  <head>
    <title>Hero Trading Card – CSS Box Model</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1e1e2b;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .card {
        background-color: #e42e4c;
        color: white;
        text-align: center;

        width: 220px;
        padding: 60px 30px;
        border: 5px solid #eb945b;
        margin: 20px;
      }

      .card h2 {
        font-size: 1.5em;
        margin-bottom: 10px;
      }

      .card p {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>⚡ Thunder Kid</h2>
      <p>Attack: 95</p>
      <p>Defence: 72</p>
      <p>Speed: 88</p>
      <p>Special: Lightning Strike</p>
    </div>
  </body>
</html>
