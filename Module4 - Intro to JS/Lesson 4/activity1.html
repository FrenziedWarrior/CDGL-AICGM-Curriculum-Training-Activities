<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Module 4 - Lesson 4 - Activity 1 - Objects and their Properties in JS.
    </title>
  </head>
  <body>
    <h2>JavaScript Objects and its Properties</h2>

    <p>There are two different ways to access an object property</p>

    <p>You can use .property or ["property"].</p>
    <p id="myParagraph"></p>
    <script>
      // Create an object:
      var person = {
        firstName: 'Abhishek',
        age: 35,
      };

      // Display some data from the object:
      document.getElementById('myParagraph').innerHTML =
        person.firstName + ' is ' + person.age + ' years old';
    </script>
  </body>
</html>
