<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Module 4 - Lesson 2 - Activity 1 - Create basic Function in JS
    </title>
  </head>
  <body>
    <button onclick="buttonEvent(52)">Execute the JS function</button>

    <script>
      function buttonEvent(x, y) {
        if (y === undefined) {
          y = 34;
        }

        document.write(x * y);
      }
    </script>
  </body>
