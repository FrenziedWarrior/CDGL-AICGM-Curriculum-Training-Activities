<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 4 - Lesson 3 - Activity 3 - Switch in JS</title>
  </head>
  <body>
    <h2>JavaScript For Loop</h2>
    <p id="demo"></p>
    <script>
      var day;
      switch (new Date().getMonth()) {
        case 0:
          day = 'January';
          break;
        case 1:
          day = 'February';
          break;
        case 2:
          day = 'March';
          break;
        case 3:
          day = 'April';
          break;
        case 4:
          day = 'May';
          break;
        case 5:
          day = 'June';
          break;
        case 6:
          day = 'July';
          break;
        case 7:
          day = 'August';
          break;
        case 8:
          day = 'Sept';
          break;
        case 9:
          day = 'Oct';
          break;
        case 10:
          day = 'Nov';
          break;
        case 11:
          day = 'Dec';
          break;
      }
      document.getElementById('demo').innerHTML = 'Today is ' + day;
    </script>
  </body>
</html>
