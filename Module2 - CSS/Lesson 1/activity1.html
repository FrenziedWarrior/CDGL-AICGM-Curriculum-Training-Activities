<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MODULE 2 - LESSON 1 - ACTIVITY 1 - My Colour Card</title>

    <style>
      /* Universal Selector - applies to everything on the page */
      * {
        font-size: 16px;
      }

      /* Element Selectors */
      body {
        background-color: lightgray;
      }

      h1 {
        color: darkblue;
      }

      h2 {
        color: purple;
      }

      p {
        color: blue;
      }

      .green-color {
        /* PROPERTY : VALUE */
        color: green;
      }
      /* Class Selector */
      /* .my-detail {
        color: darkgreen;
        font-weight: bold;
      } */

      .red-color {
        color: red;
      }

      /* ID Selector */
      #my-card {
        background-color: lightcyan;
      }
    </style>
  </head>
  <body>
    <h1>My Colour Card</h1>

    <!-- Inline CSS: Add style="color: ____;" inside this p tag -->
    <p style="color: crimson">Hi! This is my very own webpage.</p>

    <div id="my-card">
      <h2>About Me</h2>
      <p class="green-color">My name is Sam.</p>
      <p class="green-color">My favourite colour is red.</p>
      <p class="green-color">My favourite subject is Maths.</p>
      <p class="green-color">My favourite food is pasta.</p>
    </div>

    <h2>My Favourite Things</h2>
    <p class="green-color">My favourite animal is a cat.</p>
    <p class="red-color">My favourite sport is cricket.</p>
    <p>My favourite movie is The Lion King.</p>
  </body>
</html>
