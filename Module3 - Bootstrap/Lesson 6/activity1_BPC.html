<!doctype html>
<html lang="en">
  <head>
    <title>My Animal Safari</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .safari-slide {
        height: 200px;
        text-align: center;
        padding-top: 75px;
        font-size: 1.8rem;
        color: white;
      }

      .slide-forest {
        background: darkgreen;
      }

      .slide-ocean {
        background: steelblue;
      }

      .slide-desert {
        background: orange;
      }

      .section {
        padding: 70px 20px;
        min-height: 300px;
      }

      .nav-link.active {
        border-bottom: 2px solid #fff;
      }

      #forest {
        background: honeydew;
        height: 1000px;
      }

      #ocean {
        background: aliceblue;
        height: 1000px;
      }

      #desert {
        background: lightyellow;
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <!-- TOPIC 1, 2, 3: CAROUSEL -->

    <!-- TOPIC 4: SCROLLSPY -->
    <nav id="safariNav" class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top">
      <span class="navbar-brand">Safari Guide</span>
    </nav>

    <div class="container">
      <div class="section">
        <h2>🌿 Forest Safari</h2>
        <p>Explore tall trees and discover tigers, elephants, and monkeys!</p>
      </div>
      <div class="section">
        <h2>🌊 Ocean Safari</h2>
        <p>Dive deep and meet dolphins, sharks, and colourful clownfish!</p>
      </div>
      <div class="section">
        <h2>🏜️ Desert Safari</h2>
        <p>
          Trek across the sand dunes and spot camels, lizards, and desert foxes!
        </p>
      </div>
    </div>

  </body>
</html>
