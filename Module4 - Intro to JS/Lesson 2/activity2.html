<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Module 4 - Lesson 2 - Activity 2 - Scope of Variables in Functions
    </title>
  </head>
  <body>
    <p>A function can access variables defined inside the function</p>
    <button onclick="buttonEvent()">Click here</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
      var b = 40;
      function buttonEvent() {
        var a = 18;
        document.getElementById('demo').innerHTML = b * a;
        document.getElementById('demo1').innerHTML = a;
        document.getElementById('demo2').innerHTML = b;
      }
    </script>
  </body>
</html>
