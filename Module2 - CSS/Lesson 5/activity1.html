<!doctype html>
<html>
  <head>
    <title>My Animal Fact File</title>
    <style>
      /* Page background — sets the colour and font for the whole page */
      body {
        background-color: lightgreen;
        font-family: Arial, sans-serif;
      }

      .facts {
        display: flex;
      }

      /* Box Model — width sets the content area
       padding pushes the text away from the edges
       border draws a visible frame around the fact file
       margin pushes the fact file away from the screen edge */
      .fact-file {
        background-color: lightyellow;
        color: darkslategray;
        width: 260px;
        padding: 25px;
        border: 4px solid forestgreen;
        margin: 30px;
      }

      /* Animal name — forestgreen so it stands out */
      .animal-name {
        color: forestgreen;
        font-size: 22px;
      }

      /* Detail rows — dark text on the light background */
      .detail {
        color: darkslategray;
      }

      .detail::before {
        content: '=';
        color: pink;
      }

      /* Cool fact — orange and italic to make it feel special */
      .cool-fact {
        color: darkorange;
        font-style: italic;
      }

      ul {
        list-style: none;
      }

      /* ul > li::before {
      content: "🍎";
    }

    ul > li::after {
      content: "...";
    } */

      ul > li {
        margin-bottom: 20px;
        padding-bottom: 20px;
      }

      /* Except the .pizza class , apply this rule to everyone */
      ul > li:not(.pizza) {
        border-bottom: 2px solid orange;
      }
    </style>
  </head>
  <body>
    <div class="facts">
      <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, goats, and wild sheep</p>
        <p class="cool-fact">
          Cool Fact: Can leap up to 15 metres in one jump!
        </p>

      </div>
    </div>
  </body>
</html>
