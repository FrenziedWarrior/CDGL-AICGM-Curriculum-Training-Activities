<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M1 L6 Doctor's Appointment Form</title>
  </head>

  <body>

    <h1>🏥 Fortis Hospital Appointment Form</h1>
    <p>Fill in the form below to book an appointment</p>

    <form>

      <fieldset>
        <legend><h4>Personal Information</h4></legend>

        <label for="name">Patient's name</label> <br>
        <input type="text" id="name" name="name" placeholder="Enter patient name"> <br><br>
        
        <label for="medical-id">Private Medical ID</label> <br>
        <input type="password" id="medical-id" name="medical-id" placeholder="Enter secret ID" required> <br><br>

        <label for="email">Patient Email Address</label> <br>
        <input type="email" name="email" id="email"> <br><br>


        <label for="dob">Date of Birth</label> <br>
        <input type="date" id="dob" name="dob"> <br><br>
      </fieldset>

      <br>

      <fieldset>
        <legend><h3>Visit Details</h3></legend>

        <label for="doctor">Choose your doctor</label> <br>
        <select id="doctor" name="doctor">
          <option value="">Select one:</option>
          <option value="lee">Dr. Lee - General</option>
          <option value="sharma">Dr. Sharma - Dentist</option>
          <option value="khan">Dr. Khan - Child Specialist</option>
        </select>
        <br><br>

        <label>Reason for Visit</label> <br>

        <label>
          <input type="radio" name="reason1" value="c"> Cold <br>
        </label>

        <label>
          <input type="radio" name="reason2" value="f"> Fever <br>
        </label>

        <label>
          <input type="radio" name="reason3" value="t"> Tooth Ache <br>
        </label>

        <label>
          <input type="radio" name="reason4" value="o"> Other <br>
        </label>

        <br>

        <label for="notes">Any notes for the doctor?</label> <br>
        <textarea name="notes" id="notes" rows="5" cols="60"></textarea>
      </fieldset>

      <br>

      <fieldset>
        <legend>Preferred Day of Visit</legend>

      </fieldset>

      <input type="submit" value="Book your Appointment">

    </form>
  </body>
</html>
