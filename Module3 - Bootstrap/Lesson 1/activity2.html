<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 3 Lesson 1 - Activity 2 - Let’s experiment with grids</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Hello Students!</h1>
      <p>Resize the browser window to see the effect.</p>
      <div class="row">
        <!--Size Medium and extra small-->
        <div
          class="col-md-8 col-sm-4"
          style="background-color: lightcoral; border: 1px solid black"
        >
          col-md-8<br>col-sm-4
        </div>
        <div class="col-md-12 col-lg-5" style="background-color: lavender; border: 1px solid black">
          col-md-12<br>col-lg-5
        </div>
      </div>
      <div class="row">
        <!--Size Large, medium and extra small-->
        <div class="col-md-12 col-lg-6" style="background-color: lightblue; border: 1px solid black">
          col-md-12<br>col-lg-6
        </div>
        <div class="col-sm-6 col-md-2" style="background-color: lightgreen; border: 1px solid black">
          col-sm-6<br>col-md-2
        </div>
      </div>
      <div class="row" style="background-color: lightcyan; border: 1px solid black">
        <!--Size extra small-->
        <div class="col-6">col-6</div>
        <div class="col-6">col-6</div>
      </div>
    </div>
  </body>
</html>
